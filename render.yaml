services:
  - type: web
    name: sovereign-keyforge
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SYSTEM_MASTER_NAME
        value: Prophete-Kesmaner Henry
      - key: ASSISTANT_IDENTITY
        value: GrandArchitect
